

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心情音乐推荐器 | Mood Music Recommender</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #fcf9f4;
      --card: #ffffff;
      --line: #70564a;
      --line-soft: #b8a8a0;
      --text: #4a3a34;
      --text-soft: #8f7c74;
      --accent: #e59078;
      --accent-soft: #f8cdbe;
      --purple: #a7a3b1;
      --purple-soft: #d5d0df;
      --blue: #b2cde0;
      --blue-soft: #e3eef5;
      --yellow: #f6df9e;
      --bg-dot: rgba(112, 86, 74, 0.06);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px 50px;
      display: grid;
      place-items: center;
      font-family: "Nunito", "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image: 
        radial-gradient(var(--bg-dot) 1.5px, transparent 1.5px),
        radial-gradient(var(--bg-dot) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    .container {
      position: relative;
      width: min(840px, 100%);
      padding: 42px 36px 38px;
      text-align: center;
      background: var(--card);
      border: 3px solid var(--line);
      border-radius: 40px;
      box-shadow: 0 18px 40px rgba(112, 86, 74, 0.08);
    }

    .container::before {
      content: "";
      position: absolute;
      top: -15px;
      left: -15px;
      width: 40px;
      height: 40px;
      border: 3px dashed var(--accent-soft);
      border-radius: 50%;
      pointer-events: none;
    }
    .container::after {
      content: "";
      position: absolute;
      bottom: -10px;
      right: -10px;
      width: 24px;
      height: 24px;
      border: 3px dashed var(--blue);
      border-radius: 50%;
      pointer-events: none;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }

    .language-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg);
      border: 2px solid var(--line);
      border-radius: 30px;
    }

    .lang-button {
      padding: 5px 14px;
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 800;
      background: transparent;
      border: 0;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-button:hover:not(.active) {
      color: var(--text);
      background: var(--bg-dot);
    }

    .lang-button.active {
      color: var(--line);
      background: var(--yellow);
    }

    .lang-divider {
      color: var(--line-soft);
      font-size: 11px;
    }

    h1 {
      margin: 16px 0 10px;
      font-size: clamp(28px, 4vw, 36px);
      line-height: 1.3;
      font-weight: 900;
      color: var(--line);
      letter-spacing: 0.02em;
    }

    .intro {
      margin: 12px auto 26px;
      max-width: 520px;
      color: var(--text-soft);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.6;
    }

    .moods {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin: 28px 0 18px;
    }

    .mood-button {
      position: relative;
      width: 110px;
      min-height: 118px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background: var(--card);
      border: 2.5px solid var(--line);
      border-radius: 28px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 0 rgba(112, 86, 74, 0.08);
    }

    .mood-button:nth-child(odd)  { transform: rotate(-1.5deg); }
    .mood-button:nth-child(even) { transform: rotate(1.5deg); }

    .mood-button:hover,
    .mood-button:focus-visible {
      transform: translateY(-5px) rotate(0);
      box-shadow: 0 10px 0 rgba(112, 86, 74, 0.12);
      outline: none;
    }

    .mood-button.selected {
      background: #fffaf0;
      border-color: var(--accent);
      transform: translateY(-5px) rotate(0);
      box-shadow: 0 10px 0 var(--accent-soft);
    }

    .mood-icon {
      width: 58px;
      height: 58px;
      margin-bottom: 6px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mood-button:hover .mood-icon,
    .mood-button.selected .mood-icon {
      transform: scale(1.1) rotate(4deg);
    }

    .mood-name {
      font-weight: 900;
      font-size: 15px;
      color: var(--line);
    }

    .checkmark {
      min-height: 16px;
      margin-top: 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 18px;
      margin: 26px 0 20px;
    }

    .number-control {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      font-weight: 900;
      color: var(--line);
      font-size: 14px;
    }

    select,
    .action-button {
      min-height: 46px;
      padding: 10px 20px;
      font: inherit;
      font-weight: 900;
      color: var(--line);
      border: 2.5px solid var(--line);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 0 rgba(112, 86, 74, 0.15);
    }

    select {
      background: var(--card);
      appearance: none;
      padding-right: 36px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2370564a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 14px;
    }

    .action-button { background: var(--card); }
    .action-button:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(112, 86, 74, 0.15); }
    .action-button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(112, 86, 74, 0.15); }

    .recommend-button { background: var(--blue); color: var(--line); }
    .clear-button { background: var(--purple-soft); }

    .status {
      min-height: 24px;
      margin: 0 0 20px;
      font-weight: 800;
      font-size: 14px;
      color: var(--text-soft);
    }

    .error { color: #d9654b; }

    .recommendations {
      display: grid;
      gap: 22px;
      text-align: left;
    }

    .mood-results {
      padding: 24px;
      background: #fdfaf6;
      border: 2.5px solid var(--line);
      border-radius: 30px;
    }

    .mood-results h2 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      padding: 6px 16px;
      font-size: 18px;
      color: var(--line);
      background: var(--blue-soft);
      border: 2px solid var(--line);
      border-radius: 20px;
      transform: rotate(-1deg);
    }

    .mood-results h2 svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .song-list {
      display: grid;
      gap: 16px;
      margin: 0;
      padding-left: 24px;
    }

    .song-list li {
      padding-left: 6px;
      line-height: 1.6;
      color: var(--text);
    }

    .song-list li::marker {
      color: var(--accent);
      font-weight: 900;
    }

    .song-line {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .song-title { font-weight: 900; color: var(--line); }
    .artist { color: var(--text-soft); font-weight: 700; }

    .preview-btn {
      margin-left: 6px;
      padding: 4px 14px;
      color: var(--line);
      font-size: 12px;
      font-weight: 900;
      background: var(--yellow);
      border: 2px solid var(--line);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 0 rgba(112, 86, 74, 0.15);
    }

    .preview-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 0 rgba(112, 86, 74, 0.15); }
    .preview-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 2px 0 rgba(112, 86, 74, 0.15); }
    .preview-btn[data-state="playing"] { color: #fff; background: var(--accent); }
    .preview-btn[data-state="loading"] { opacity: 0.8; cursor: progress; }
    .preview-btn:disabled { color: var(--line-soft); background: #eeeae6; border-color: var(--line-soft); box-shadow: none; cursor: not-allowed; }

    .lyrics-panel {
      position: relative;
      height: 128px;
      margin-top: 12px;
      overflow: hidden;
      background: var(--card);
      border: 2px solid var(--line-soft);
      border-radius: 20px;
      text-align: left;
    }

    .lyrics-panel[hidden] { display: none; }

    .lyrics-panel::before,
    .lyrics-panel::after {
      content: ""; position: absolute; left: 0; right: 0; height: 16px; pointer-events: none; z-index: 2;
    }
    .lyrics-panel::before { top: 0; background: linear-gradient(180deg, var(--card) 10%, transparent); }
    .lyrics-panel::after { bottom: 0; background: linear-gradient(0deg, var(--card) 10%, transparent); }

    .lyrics-track {
      padding: 48px 20px;
      transition: transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: transform;
    }

    .lyric-line {
      height: 32px; margin: 0; line-height: 32px; color: var(--line-soft);
      font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: all 0.2s;
    }

    .lyric-line.lyric-meta { color: var(--text-soft); font-size: 12px; opacity: 0.7; }
    .lyric-line.active { color: var(--line); font-weight: 900; font-size: 15px; }
    .lyric-line.active::before { content: "❀ "; color: var(--accent); }

    .lyrics-status {
      position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
      margin: 0; padding: 0 16px; color: var(--text-soft); font-size: 13px; font-weight: 700; text-align: center;
    }

    .lyrics-warning {
      position: absolute; bottom: 4px; left: 8px; right: 8px;
      color: #c9953b; font-size: 11px; font-weight: 700; text-align: center; pointer-events: none;
    }

    @media (max-width: 560px) {
      .container { padding: 28px 20px; border-radius: 30px; }
      .mood-button { width: 96px; min-height: 106px; }
      .mood-icon { width: 48px; height: 48px; }
      .controls, .number-control, select, .action-button { width: 100%; }
    }
  </style>
</head>

    function normalizeUrl(url) {
      if (!url) return null;
      if (url.startsWith("//")) return "https:" + url;
      if (url.startsWith("http://")) return "https://" + url.slice(7);
      return url;
    }

    async function fetchPlayback(title, artist) {
      const key = `${title}|${artist}`;
      if (playbackCache.has(key)) return playbackCache.get(key);

      let result = { url: null, lrc: null, fullTrack: false };
      const queries = [`${title} ${artist}`, title];
      let hitId = null;

      for (const q of queries) {
        try {
          const searchUrl = "https://music-api.gdstudio.xyz/api.php?types=search&source=netease" + `&name=${encodeURIComponent(q)}&count=10&pages=1`;
          const res = await fetch(searchUrl);
          if (!res.ok) continue;
          const list = await res.json();
          if (!Array.isArray(list) || !list.length) continue;

          const titleLower = title.toLowerCase();
          const exact = list.find((item) => (item.name || "").toLowerCase() === titleLower);
          const contains = list.find((item) => (item.name || "").toLowerCase().includes(titleLower));
          const hit = exact || contains || list[0];
          if (hit && hit.id) { hitId = hit.id; break; }
        } catch (e) { /* 继续 */ }
      }

      if (hitId) {
        try {
          const [urlRes, lyricRes] = await Promise.all([
            fetch(`https://music-api.gdstudio.xyz/api.php?types=url&source=netease&id=${hitId}&br=320`),
            fetch(`https://music-api.gdstudio.xyz/api.php?types=lyric&source=netease&id=${hitId}`)
          ]);

          let url = null;
          let lrc = null;

          if (urlRes.ok) {
            const data = await urlRes.json();
            if (data && data.url) url = normalizeUrl(data.url);
          }
          if (lyricRes.ok) {
            const data = await lyricRes.json();
            if (data) {
              const candidates = [data.lyric, data.tlyric, data.rlyric];
              for (const c of candidates) {
                if (c && typeof c === "string" && /\[\d{1,3}:\d{1,2}/.test(c)) { lrc = c; break; }
              }
            }
          }

          if (url) {
            result = { url, lrc, fullTrack: true };
            playbackCache.set(key, result);
            return result;
          }
        } catch (e) { /* 回退 */ }
      }

      let fallbackUrl = await fetchDeezerPreview(title, artist);
      if (!fallbackUrl) fallbackUrl = await fetchItunesPreview(title, artist);

      if (fallbackUrl) {
        let lrc = null;
        try {
          const res = await fetch(`https://lrclib.net/api/get?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.syncedLyrics) lrc = data.syncedLyrics;
          }
        } catch (e) { /* 静默 */ }
        result = { url: fallbackUrl, lrc, fullTrack: false };
      }

      playbackCache.set(key, result);
      return result;
    }

    function fetchDeezerPreview(title, artist) {
      return new Promise((resolve) => {
        const cb = `dz_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        const script = document.createElement("script");
        let done = false;
        const finish = (v) => {
          if (done) return; done = true; clearTimeout(timer);
          if (script.parentNode) script.parentNode.removeChild(script);
          try { delete window[cb]; } catch (e) { window[cb] = undefined; }
          resolve(v);
        };
        const timer = setTimeout(() => finish(null), 6000);
        window[cb] = (data) => {
          let url = null;
          if (data && Array.isArray(data.data)) {
            const exact = data.data.find((item) => (item.title || "").toLowerCase() === title.toLowerCase() && item.preview);
            url = exact ? exact.preview : (data.data.find((item) => item.preview) || {}).preview || null;
          }
          finish(url);
        };
        script.onerror = () => finish(null);
        script.src = `https://api.deezer.com/search?q=${encodeURIComponent(`${title} ${artist}`)}&output=jsonp&callback=${cb}`;
        document.body.appendChild(script);
      });
    }

    function fetchItunesPreview(title, artist) {
      return new Promise((resolve) => {
        const cb = `it_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        const script = document.createElement("script");
        let done = false;
        const finish = (v) => {
          if (done) return; done = true; clearTimeout(timer);
          if (script.parentNode) script.parentNode.removeChild(script);
          try { delete window[cb]; } catch (e) { window[cb] = undefined; }
          resolve(v);
        };
        const timer = setTimeout(() => finish(null), 8000);
        window[cb] = (data) => {
          let url = null;
          if (data && Array.isArray(data.results)) {
            const match = data.results.find((item) => item.previewUrl);
            if (match) url = match.previewUrl;
          }
          finish(url);
        };
        script.onerror = () => finish(null);
        script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(`${title} ${artist}`)}&media=music&limit=5&callback=${cb}`;
        document.body.appendChild(script);
      });
    }

    const META_LINE_RE = /^(作词|作曲|编曲|词|曲|编|制作人|监制|混音|母带|和声|录音|吉他|贝斯|鼓|键盘|弦乐|出品|发行|OP|SP|Presented|Produced|Composed|Arranged|Lyrics|Lyricist|Music|Producer|Written|Mixed|Mastered|Engineered|Vocals|Guitar|Bass|Drums|Keys|Strings|Recorded|Additional)/i;

    function parseLRC(lrcText) {
      if (!lrcText || typeof lrcText !== "string") return [];
      const timeTagRe = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
      if (!/\[\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?\]/.test(lrcText)) return [];

      let globalOffset = 0;
      const offsetMatch = lrcText.match(/\[offset:\s*([+-]?\d+)\s*\]/i);
      if (offsetMatch) globalOffset = parseInt(offsetMatch[1], 10) / 1000;

      const metaTagRe = /^\[(ti|ar|al|by|offset|re|ve|kana|length|au|encoding|id|hash|total|sign|qq|url|tool|platform):/i;
      const lines = [];

      lrcText.split(/\r?\n/).forEach((raw) => {
        if (!raw || metaTagRe.test(raw.trim())) return;
        const matches = [...raw.matchAll(timeTagRe)];
        if (!matches.length) return;

        const lastMatch = matches[matches.length - 1];
        const text = raw.slice(lastMatch.index + lastMatch[0].length).trim();
        if (!text) return;

        const tags = matches.map((m) => {
          const min = parseInt(m[1], 10);
          const sec = parseInt(m[2], 10);
          const fracStr = m[3] || "0";
          const frac = parseInt(fracStr.padEnd(3, "0").slice(0, 3), 10);
          return min * 60 + sec + frac / 1000 - globalOffset;
        });

        const isMeta = META_LINE_RE.test(text);
        tags.forEach((time) => {
          if (Number.isFinite(time) && time >= 0) lines.push({ time, text, isMeta });
        });
      });

      lines.sort((a, b) => a.time - b.time);

      let firstBodyIdx = 0;
      while (firstBodyIdx < lines.length && lines[firstBodyIdx].isMeta) firstBodyIdx++;

      if (firstBodyIdx > 1) {
        const nextTime = firstBodyIdx < lines.length ? lines[firstBodyIdx].time : 1;
        const win = Math.min(0.4, Math.max(0.15, nextTime * 0.25));
        const step = win / (firstBodyIdx - 1 || 1);
        for (let i = 0; i < firstBodyIdx; i++) {
          lines[i].time = i * step;
          lines[i].isMeta = true;
        }
      }
      return lines;
    }

    function renderLyrics(panel, lyrics) {
      if (!lyrics.length) {
        panel.innerHTML = `<p class="lyrics-status">${escapeHtml(t("lyrics.unavailable"))}</p>`;
        panel.dataset.activeIndex = "-1";
        panel.dataset.scrollIndex = "-1";
        return;
      }

      panel.innerHTML = `<div class="lyrics-track">${lyrics
        .map((l) => `<p class="lyric-line${l.isMeta ? " lyric-meta" : ""}" data-time="${l.time}">${escapeHtml(l.text)}</p>`)
        .join("")}</div>`;

      panel.dataset.activeIndex = "-1";
      panel.dataset.scrollIndex = "-1";
      panel.querySelector(".lyrics-track").style.transform = "translateY(0)";
      requestAnimationFrame(() => updateLyricHighlight());
    }

    function updateLyricHighlight() {
      if (!currentAudio || !currentLyricsPanel || currentLyricsPanel.hidden) return;
      const track = currentLyricsPanel.querySelector(".lyrics-track");
      if (!track) return;
      const lines = track.querySelectorAll(".lyric-line");
      if (!lines.length) return;

      const now = currentAudio.currentTime + currentAudioOffset;
      let activeIndex = -1;
      for (let i = 0; i < lines.length; i++) {
        const lt = parseFloat(lines[i].dataset.time);
        if (Number.isFinite(lt) && lt <= now + 0.05) activeIndex = i;
        else break;
      }

      let scrollIndex = activeIndex >= 0 ? activeIndex : 0;

      const prevActive = parseInt(currentLyricsPanel.dataset.activeIndex ?? "-1", 10);
      if (activeIndex !== prevActive) {
        lines.forEach((l, i) => l.classList.toggle("active", i === activeIndex));
        currentLyricsPanel.dataset.activeIndex = String(activeIndex);
      }

      const prevScroll = parseInt(currentLyricsPanel.dataset.scrollIndex ?? "-1", 10);
      if (scrollIndex !== prevScroll) {
        track.style.transform = `translateY(${-scrollIndex * 32}px)`;
        currentLyricsPanel.dataset.scrollIndex = String(scrollIndex);
      }
    }

    function startSyncLoop() {
      if (rafId) return;
      const tick = () => {
        if (currentAudio && !currentAudio.paused) updateLyricHighlight();
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    }

    function stopSyncLoop() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    function stopPreview() {
      stopSyncLoop();
      if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
      if (currentPreviewButton) {
        updatePreviewButton(currentPreviewButton, "idle");
        currentPreviewButton = null;
      }
      if (currentLyricsPanel) {
        currentLyricsPanel.hidden = true;
        currentLyricsPanel.innerHTML = "";
        currentLyricsPanel = null;
      }
      currentAudioOffset = 0;
    }

    async function handlePreviewClick(song, button) {
      if (currentPreviewButton === button && currentAudio) {
        if (currentAudio.paused) {
          try {
            await currentAudio.play();
            updatePreviewButton(button, "playing");
            startSyncLoop();
            updateLyricHighlight();
          } catch (e) { updatePreviewButton(button, "idle"); }
        } else {
          currentAudio.pause();
          updatePreviewButton(button, "paused");
          stopSyncLoop();
        }
        return;
      }

      if (currentAudio || currentPreviewButton) stopPreview();
      if (button.dataset.state === "unavailable") return;

      const li = button.closest("li");
      const panel = li ? li.querySelector(".lyrics-panel") : null;

      if (panel) {
        panel.hidden = false;
        panel.innerHTML = `<p class="lyrics-status">${escapeHtml(t("lyrics.loading"))}</p>`;
        panel.dataset.activeIndex = "-1";
        panel.dataset.scrollIndex = "-1";
      }

      updatePreviewButton(button, "loading");
      const playback = await fetchPlayback(song.title, song.artist);

      if (!button.isConnected) return;

      if (!playback.url) {
        updatePreviewButton(button, "unavailable");
        if (panel) { panel.hidden = true; panel.innerHTML = ""; }
        return;
      }

      const lyrics = playback.lrc ? parseLRC(playback.lrc) : [];

      currentAudioOffset = 0;
      if (!playback.fullTrack && lyrics.length) {
        const firstBody = lyrics.find((l) => !l.isMeta && l.time > 5);
        if (firstBody) currentAudioOffset = Math.max(0, firstBody.time - 1.5);
      }

      if (panel) {
        renderLyrics(panel, lyrics);
        if (!playback.fullTrack && lyrics.length) {
          const warn = document.createElement("div");
          warn.className = "lyrics-warning";
          warn.textContent = t("lyrics.fragmentWarning");
          panel.appendChild(warn);
        }
      }

      const audio = new Audio(playback.url);
      audio.preload = "auto";
      currentAudio = audio;
      currentPreviewButton = button;
      currentLyricsPanel = panel;

      audio.addEventListener("loadedmetadata", () => {
        if (!lyrics.length || !Number.isFinite(audio.duration)) return;
        const lastLyricTime = lyrics[lyrics.length - 1].time;
        const isFragment = lastLyricTime > 10 && audio.duration < lastLyricTime * 0.6;

        if (isFragment && playback.fullTrack) {
          const firstBody = lyrics.find((l) => !l.isMeta && l.time > 5);
          if (firstBody) currentAudioOffset = Math.max(0, firstBody.time - 1.5);
          updateLyricHighlight();
          if (panel && !panel.querySelector(".lyrics-warning")) {
            const warn = document.createElement("div");
            warn.className = "lyrics-warning";
            warn.textContent = t("lyrics.fragmentWarning");
            panel.appendChild(warn);
          }
        }
      });

      audio.addEventListener("timeupdate", updateLyricHighlight);
      audio.addEventListener("ended", () => {
        if (currentPreviewButton === button) {
          updatePreviewButton(button, "idle");
          currentAudio = null;
          currentPreviewButton = null;
          stopSyncLoop();
        }
      });

      audio.addEventListener("error", () => {
        if (currentPreviewButton === button) {
          updatePreviewButton(button, "unavailable");
          button.dataset.previewUrl = "";
          currentAudio = null;
          currentPreviewButton = null;
          stopSyncLoop();
          if (currentLyricsPanel === panel) currentLyricsPanel = null;
        }
      });

      updatePreviewButton(button, "playing");
      try {
        await audio.play();
        updateLyricHighlight();
        startSyncLoop();
      } catch (e) {
        updatePreviewButton(button, "idle");
        if (currentPreviewButton === button) {
          currentAudio = null;
          currentPreviewButton = null;
          stopSyncLoop();
        }
      }
    }

    function t(key, vars = {}) {
      const dict = UI[lang] || UI.zh;
      const tpl = dict[key] || UI.zh[key] || key;
      return tpl.replace(/\{(\w+)\}/g, (m, name) => {
        if (Object.prototype.hasOwnProperty.call(vars, name)) return String(vars[name]);
        if (name === "suffix") return lang === "en" && vars.count !== 1 ? "s" : "";
        if (name === "moodSuffix") return lang === "en" && vars.moodCount !== 1 ? "s" : "";
        return m;
      });
    }

    function escapeHtml(v) {
      return String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function moodLabel(k) { return MOODS[k].label[lang]; }

    function updateLanguageButtons() {
      document.querySelectorAll(".lang-button").forEach((b) => {
        const active = b.dataset.lang === lang;
        b.classList.toggle("active", active);
        b.setAttribute("aria-pressed", String(active));
      });
    }

    function updateStaticText() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = lang === "zh" ? "心情音乐推荐器 | Mood Music Recommender" : "Mood Music Recommender | 心情音乐推荐器";
      pageTitle.textContent = t("page.title");
      pageIntro.textContent = t("page.intro");
      moodButtonsWrap.setAttribute("aria-label", t("moods.aria"));
      songsPerMoodLabel.textContent = t("songsPerMood");
      recommendButton.textContent = t("button.recommend");
      clearButton.textContent = t("button.clear");
      recommendations.setAttribute("aria-label", t("recommendations.aria"));
      renderSongCountOptions();
      renderMoodButtons();
      updateStatus();
      renderRecommendationsFromState();
    }

    function renderSongCountOptions() {
      const cur = songCount.value || "3";
      songCount.innerHTML = [1, 2, 3, 4, 5]
        .map((c) => `<option value="${c}">${escapeHtml(t("songCount.option", { count: c }))}</option>`)
        .join("");
      songCount.value = cur;
    }

    function renderMoodButtons() {
      moodButtonsWrap.innerHTML = MOOD_KEYS.map((k) => {
        const m = MOODS[k], sel = selectedMoods.has(k);
        return `
          <button class="mood-button ${sel ? "selected" : ""}" type="button" data-mood="${k}" aria-pressed="${sel}">
            ${SVG_ICONS[k]}
            <span class="mood-name">${escapeHtml(m.label[lang])}</span>
            <span class="checkmark" aria-hidden="true">${sel ? escapeHtml(t("selected.mark")) : ""}</span>
          </button>
        `;
      }).join("");
      moodButtonsWrap.querySelectorAll(".mood-button").forEach((b) => {
        b.addEventListener("click", () => toggleMood(b.dataset.mood));
      });
    }

    function toggleMood(k) {
      if (selectedMoods.has(k)) selectedMoods.delete(k);
      else selectedMoods.add(k);
      if (currentRecommendationState) {
        currentRecommendationState = null;
        stopPreview();
        recommendations.replaceChildren();
      }
      renderMoodButtons();
      updateStatus();
    }

    function updateStatus() {
      status.classList.remove("error");
      if (selectedMoods.size === 0) {
        status.textContent = t("status.noMoods");
        return;
      }
      const names = [...selectedMoods].map((k) => `${moodLabel(k)}`); 
      status.textContent = t("status.selected", {
        count: selectedMoods.size,
        names: names.join(lang === "zh" ? "、" : ", ")
      });
    }

    function getRandomSongs(list, amount) {
      const a = [...list];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a.slice(0, amount);
    }

    function generateRecommendation() {
      const amount = Number(songCount.value);
      const results = [...selectedMoods].map((k) => ({
        moodKey: k,
        songs: getRandomSongs(MOODS[k].songs[lang], amount)
      }));
      return { results, amount };
    }

    function renderRecommendationsFromState() {
      if (!currentRecommendationState) {
        recommendations.replaceChildren();
        return;
      }
      const { results } = currentRecommendationState;
      recommendations.replaceChildren();

      results.forEach(({ moodKey, songs }) => {
        const mood = MOODS[moodKey];
        const section = document.createElement("article");
        const heading = document.createElement("h2");
        const list = document.createElement("ol");
        section.className = "mood-results";
        list.className = "song-list";
        
        const iconSvg = SVG_ICONS[moodKey].replace('class="mood-icon"', '');
        heading.innerHTML = `${iconSvg} <span>${mood.label[lang]}</span>`;

        songs.forEach((song) => {
          const item = document.createElement("li");
          const line = document.createElement("span");
          const title = document.createElement("span");
          const artist = document.createElement("span");
          const btn = document.createElement("button");
          const panel = document.createElement("div");

          line.className = "song-line";
          title.className = "song-title";
          artist.className = "artist";
          title.textContent = song.title;
          artist.textContent = `  ${song.artist}`;

          btn.className = "preview-btn";
          btn.type = "button";
          btn.dataset.state = "idle";
          btn.dataset.previewUrl = "";
          btn.textContent = previewLabel("idle");
          btn.addEventListener("click", () => handlePreviewClick(song, btn));

          panel.className = "lyrics-panel";
          panel.hidden = true;
          panel.dataset.activeIndex = "-1";
          panel.dataset.scrollIndex = "-1";
          panel.setAttribute("aria-live", "polite");

          line.append(title, artist, btn);
          item.append(line, panel);
          list.appendChild(item);
        });

        section.append(heading, list);
        recommendations.appendChild(section);
      });

      const total = selectedMoods.size * currentRecommendationState.amount;
      status.classList.remove("error");
      status.textContent = t("status.showing", {
        total,
        moodCount: selectedMoods.size
      });
    }

    recommendButton.addEventListener("click", () => {
      stopPreview();
      if (selectedMoods.size === 0) {
        status.textContent = t("status.error");
        status.classList.add("error");
        recommendations.replaceChildren();
        currentRecommendationState = null;
        return;
      }
      currentRecommendationState = generateRecommendation();
      renderRecommendationsFromState();
    });

    clearButton.addEventListener("click", () => {
      stopPreview();
      selectedMoods.clear();
      currentRecommendationState = null;
      recommendations.replaceChildren();
      renderMoodButtons();
      updateStatus();
    });

    document.querySelectorAll(".lang-button").forEach((b) => {
      b.addEventListener("click", () => {
        const next = b.dataset.lang;
        if (next === lang) return;
        stopPreview();
        lang = next;
        updateLanguageButtons();
        if (currentRecommendationState) {
          currentRecommendationState = generateRecommendation();
        }
        updateStaticText();
      });
    });

    updateStaticText();
  </script>
</body>
</html>
