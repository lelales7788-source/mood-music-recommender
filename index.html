<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心情音乐推荐器 | Mood Music Recommender</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
      width: min(860px, 100%);
      padding: 32px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }

    .language-switch {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px;
      background: rgba(0, 0, 0, 0.22);
      border-radius: 999px;
    }

    .lang-button {
      padding: 6px 11px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 700;
      background: transparent;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }

    .lang-button:hover:not(.active) {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .lang-button.active {
      color: #222;
      background: #ffd166;
    }

    .lang-divider {
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(26px, 4vw, 34px);
      line-height: 1.25;
    }

    .intro {
      margin: 0 auto 22px;
      max-width: 560px;
      color: rgba(255, 255, 255, 0.86);
      font-size: 15px;
      line-height: 1.65;
    }

    .moods {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin: 28px 0;
    }

    .mood-button {
      width: 105px;
      min-height: 108px;
      padding: 10px;
      border: 3px solid transparent;
      border-radius: 18px;
      color: #222;
      background: #fff;
      cursor: pointer;
      transition:
        transform 0.2s,
        border-color 0.2s,
        background-color 0.2s;
    }

    .mood-button:hover,
    .mood-button:focus-visible {
      transform: translateY(-5px);
      border-color: #ffd166;
      outline: none;
    }

    .mood-button.selected {
      border-color: #ffd166;
      background: #fff3bd;
      transform: translateY(-5px);
    }

    .emoji {
      display: block;
      font-size: 42px;
    }

    .mood-name {
      display: block;
      margin-top: 6px;
      font-weight: bold;
    }

    .checkmark {
      display: block;
      min-height: 18px;
      margin-top: 4px;
      color: #157347;
      font-size: 12px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: end;
      gap: 14px;
      margin-bottom: 26px;
    }

    .number-control {
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-align: left;
      font-weight: bold;
      color: #fff;
    }

    select,
    .action-button {
      min-height: 44px;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font: inherit;
    }

    select {
      color: #222;
      background: #fff;
      cursor: pointer;
    }

    .action-button {
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .action-button:hover {
      transform: translateY(-2px);
    }

    .recommend-button {
      color: #222;
      background: #ffd166;
    }

    .clear-button {
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
    }

    .status {
      min-height: 24px;
      margin: 0 0 16px;
      font-weight: bold;
      font-size: 14px;
    }

    .error {
      color: #fff3bd;
    }

    .recommendations {
      display: grid;
      gap: 18px;
      text-align: left;
    }

    .mood-results {
      padding: 20px;
      border-radius: 16px;
      color: #222;
      background: #fff;
    }

    .mood-results h2 {
      margin: 0 0 14px;
      color: #6441a5;
      font-size: 20px;
    }

    .song-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding-left: 28px;
    }

    .song-list li {
      padding-left: 4px;
      line-height: 1.5;
    }

    .song-title {
      font-weight: bold;
    }

    .song-subtitle {
      margin-left: 6px;
      color: #777;
      font-size: 13px;
    }

    .artist {
      color: #555;
    }

    @media (max-width: 540px) {
      .container {
        padding: 24px 16px;
      }

      .mood-button {
        width: 96px;
      }

      .controls,
      .number-control,
      select,
      .action-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="top-bar">
      <div class="language-switch" role="group" aria-label="Language / 语言">
        <button class="lang-button active" type="button" data-lang="zh" aria-pressed="true">中文</button>
        <span class="lang-divider" aria-hidden="true">|</span>
        <button class="lang-button" type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>

    <h1 id="pageTitle">心情音乐推荐器</h1>
    <p class="intro" id="pageIntro">
      选择一个或多个心情，再决定每种心情想听几首歌。
    </p>

    <div class="moods" id="moodButtons" role="group" aria-label="选择心情">
      <!-- 由 JS 动态渲染 -->
    </div>

    <div class="controls">
      <label class="number-control" for="songCount">
        <span id="songsPerMoodLabel">每种心情歌曲数</span>
        <select id="songCount"></select>
      </label>

      <button class="action-button recommend-button" id="recommendButton" type="button">
        推荐歌曲
      </button>

      <button class="action-button clear-button" id="clearButton" type="button">
        清空选择
      </button>
    </div>

    <p class="status" id="status" aria-live="polite">
      尚未选择心情。
    </p>

    <section
      class="recommendations"
      id="recommendations"
      aria-label="歌曲推荐"
      aria-live="polite"
    ></section>
  </main>

    const moodButtonsWrap = document.getElementById("moodButtons");
    const songsPerMoodLabel = document.getElementById("songsPerMoodLabel");
    const songCount = document.getElementById("songCount");
    const recommendButton = document.getElementById("recommendButton");
    const clearButton = document.getElementById("clearButton");
    const status = document.getElementById("status");
    const recommendations = document.getElementById("recommendations");

    function t(key, vars = {}) {
      const dictionary = UI[lang] || UI.zh;
      const template = dictionary[key] || UI.zh[key] || key;

      return template.replace(/\{(\w+)\}/g, (match, name) => {
        if (Object.prototype.hasOwnProperty.call(vars, name)) {
          return String(vars[name]);
        }
        if (name === "suffix") {
          return lang === "en" && vars.count !== 1 ? "s" : "";
        }
        if (name === "moodSuffix") {
          return lang === "en" && vars.moodCount !== 1 ? "s" : "";
        }
        return match;
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => {
        const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        return map[char];
      });
    }

    function moodLabel(moodKey) {
      return MOODS[moodKey].label[lang];
    }

    function updateStaticText() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = lang === "zh"
        ? "心情音乐推荐器 | Mood Music Recommender"
        : "Mood Music Recommender | 心情音乐推荐器";

      pageTitle.textContent = t("page.title");
      pageIntro.textContent = t("page.intro");
      moodButtonsWrap.setAttribute("aria-label", t("moods.aria"));
      songsPerMoodLabel.textContent = t("songsPerMood");
      recommendButton.textContent = t("button.recommend");
      clearButton.textContent = t("button.clear");
      recommendations.setAttribute("aria-label", t("recommendations.aria"));

      renderSongCountOptions();
      renderMoodButtons();
      updateStatus();
      renderRecommendationsFromState();
    }

    function renderSongCountOptions() {
      const currentValue = songCount.value || "3";
      songCount.innerHTML = [1, 2, 3, 4, 5].map((count) => {
        return `<option value="${count}">${escapeHtml(t("songCount.option", { count }))}</option>`;
      }).join("");
      songCount.value = currentValue;
    }

    function renderMoodButtons() {
      moodButtonsWrap.innerHTML = MOOD_KEYS.map((moodKey) => {
        const mood = MOODS[moodKey];
        const isSelected = selectedMoods.has(moodKey);

        return `
          <button
            class="mood-button ${isSelected ? "selected" : ""}"
            type="button"
            data-mood="${moodKey}"
            aria-pressed="${isSelected}"
          >
            <span class="emoji" aria-hidden="true">${mood.emoji}</span>
            <span class="mood-name">${escapeHtml(mood.label[lang])}</span>
            <span class="checkmark" aria-hidden="true">${isSelected ? escapeHtml(t("selected.mark")) : ""}</span>
          </button>
        `;
      }).join("");

      moodButtonsWrap.querySelectorAll(".mood-button").forEach((button) => {
        button.addEventListener("click", () => toggleMood(button.dataset.mood));
      });
    }

    function toggleMood(moodKey) {
      if (selectedMoods.has(moodKey)) {
        selectedMoods.delete(moodKey);
      } else {
        selectedMoods.add(moodKey);
      }

      renderMoodButtons();
      updateStatus();
    }

    function updateStatus() {
      status.classList.remove("error");

      if (selectedMoods.size === 0) {
        status.textContent = t("status.noMoods");
        return;
      }

      const names = [...selectedMoods].map((moodKey) => {
        return `${MOODS[moodKey].emoji} ${moodLabel(moodKey)}`;
      });

      status.textContent = t("status.selected", {
        count: selectedMoods.size,
        names: names.join(lang === "zh" ? "、" : ", ")
      });
    }

    function getRandomSongs(songList, amount) {
      const shuffled = [...songList];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[i]];
      }

      return shuffled.slice(0, amount);
    }

    let currentRecommendationState = null;

    function renderRecommendationsFromState() {
      if (!currentRecommendationState) {
        recommendations.replaceChildren();
        return;
      }

      const { results, amount } = currentRecommendationState;
      recommendations.replaceChildren();

      results.forEach(({ moodKey, songs }) => {
        const mood = MOODS[moodKey];
        const section = document.createElement("article");
        const heading = document.createElement("h2");
        const list = document.createElement("ol");

        section.className = "mood-results";
        list.className = "song-list";

        heading.textContent = `${mood.emoji} ${mood.label[lang]}`;

        songs.forEach((song) => {
          const item = document.createElement("li");
          const title = document.createElement("span");
          const subtitle = document.createElement("span");
          const artist = document.createElement("span");

          title.className = "song-title";
          subtitle.className = "song-subtitle";
          artist.className = "artist";

          title.textContent = song.title;
          subtitle.textContent = `（${t("song.subtitle")}: ${song.subtitle}）`;
          artist.textContent = ` — ${song.artist}`;

          item.append(title, subtitle, artist);
          list.appendChild(item);
        });

        section.append(heading, list);
        recommendations.appendChild(section);
      });

      const total = selectedMoods.size * amount;
      status.classList.remove("error");
      status.textContent = t("status.showing", {
        total,
        moodCount: selectedMoods.size
      });
    }

    recommendButton.addEventListener("click", () => {
      if (selectedMoods.size === 0) {
        status.textContent = t("status.error");
        status.classList.add("error");
        recommendations.replaceChildren();
        currentRecommendationState = null;
        return;
      }

      const amount = Number(songCount.value);
      const results = [...selectedMoods].map((moodKey) => ({
        moodKey,
        songs: getRandomSongs(MOODS[moodKey].songs, amount)
      }));

      currentRecommendationState = { results, amount };
      renderRecommendationsFromState();
    });

    clearButton.addEventListener("click", () => {
      selectedMoods.clear();
      currentRecommendationState = null;
      recommendations.replaceChildren();
      renderMoodButtons();
      updateStatus();
    });

    document.querySelectorAll(".lang-button").forEach((button) => {
      button.addEventListener("click", () => {
        const nextLang = button.dataset.lang;
        if (nextLang === lang) {
          return;
        }

        lang = nextLang;

        document.querySelectorAll(".lang-button").forEach((langButton) => {
          const active = langButton.dataset.lang === lang;
          langButton.classList.toggle("active", active);
          langButton.setAttribute("aria-pressed", String(active));
        });

        updateStaticText();
      });
    });

    updateStaticText();
  </script>
</body>
</html>
